[package]
name = "texos"
version = "1.4.8"
description = "TexoS - 織り紡ぐ者たち"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "texos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
arboard = "3"
regex = "1"
# v1.4.0 AIフィルタ（builtin:"ai"）: Ollama/OpenAI準拠への同期HTTP。
# v1.4.8 で rustls-tls を追加（Whisper 自動導入の GitHub/HuggingFace ダウンロードが https のため）。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# v1.4.8: whisper.cpp リリース zip（Windowsバイナリ）の展開用。
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# v1.4.0 AIフィルタの回帰テスト用。本番(Tauri command async)と同じ tokio 文脈を
# 再現して run_ai がパニックしないことを検証する。reqwest 経由で既にビルド済み。
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

