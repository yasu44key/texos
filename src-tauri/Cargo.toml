[package]
name = "texos"
version = "1.11.1"
description = "TexoS - 織り紡ぐ者たち"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "texos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
arboard = "3"
regex = "1"
# v1.4.0 AIフィルタ（builtin:"ai"）: Ollama/OpenAI準拠への同期HTTP。
# v1.4.8 で rustls-tls を追加（Whisper 自動導入の GitHub/HuggingFace ダウンロードが https のため）。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# v1.4.8: whisper.cpp リリース zip（Windowsバイナリ）の展開用。
zip = { version = "2", default-features = false, features = ["deflate"] }
# v1.4.13: 仮身（読み取り専用閲覧）の非UTF-8テキストをデコードして表示する。
# 元バイト列は変更しない非破壊ビュー。実身化（UTF-8変換）はフィルタ側の分担。
encoding_rs = "0.8"
chardetng = "0.1"
# v1.5.4 WS-P2: タイマの at:"HH:MM"（ローカル時刻）判定用。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# v1.5.17 P2集約系: text_diff（unified diff）。自前実装せず定番に乗る（MIT/Apache）。
similar = "2"
# v1.7 P1 web_fetch: 本文抽出（readability 相当・MIT）と HTML→Markdown（Apache-2.0）。
# ライセンス確認済み 2026-07-16（V1.7_情報収集経路計画.md §6-6）。HTTP は既存 reqwest を共用。
dom_smoothie = "0.18"
htmd = "0.5"
# v1.7 P1: URL のホスト種別判定（url::Host の match 用。reqwest が既に同梱＝実質依存増なし）。
url = "2"
# v1.7 P3 web_feed: RSS/Atom パース（MIT）。ライセンス確認済み 2026-07-17（計画 §6-6）。
feed-rs = "2"

[dev-dependencies]
# v1.4.0 AIフィルタの回帰テスト用。本番(Tauri command async)と同じ tokio 文脈を
# 再現して run_ai がパニックしないことを検証する。reqwest 経由で既にビルド済み。
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # Web検索 P1: CreateJobObjectW の引数型（SECURITY_ATTRIBUTES）。
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  # Web検索 P1: SearXNG デーモンを TexoS と一蓮托生にする Job Object（KILL_ON_JOB_CLOSE）。
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  # v1.11 MCP 接続: ローカル IPC（名前付きパイプ）。ConnectNamedPipe の引数型が IO 側。
  "Win32_System_IO",
  "Win32_System_Pipes",
  # v1.4.28 WS3: GlobalMemoryStatusEx（RAM 総量検出）。
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  # v1.8.1 ドラッグアウト: SHCreateDataObject（シェル既製の IDataObject）が
  # ITEMIDLIST を引数に取るため Shell_Common が要る。SHDoDragDrop は Ole 側。
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

